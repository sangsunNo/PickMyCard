<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="kr">
<head>
    <meta charset="UTF-8">
    <title>Pick My Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. body가 화면 전체를 차지하도록 설정 */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .navbar {
            background-color: #DCD0B2;
            transition: transform 0.3s ease-in-out;
        }

        .navbar-hidden {
            transform: translateY(-100%);
        }

        .row-container {
            display: flex;
            flex-direction: column;

        }

        /* 2. main 영역을 Flex 컨테이너로 설정하여 상하 중앙 정렬 */
        main {
            flex: 1;
            margin: 3% 7% 3% 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* 추가: carousel 이미지의 높이를 제한하여 반응형 유지 */
        .carousel-container {
            max-height: 75vh;
        }

        .fade-out {
            opacity: 0;
            transition opacity 0.2s;
        }

        .fade-in {
            opacity: 1;
            transition: opacity 0.2s;
        }

        .balloon-container {
            position: relative; /* 말풍선 컨테이너를 기준으로 설정 */
            width: 100%;
            padding: 0% 10% 0% 10%;
        }

        .balloon {
            position: relative; /* 말풍선 자체는 상대적으로 위치 */
            width: 80%; /* 반응형 크기를 유지 */
            max-width: 350px;
            height: 85px;
            padding: 10px;
            margin: 5vh auto;
            background: #FFFFFF;
            border-radius: 20px;
            border: #000000 solid 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .balloon:after {
            content: '';
            position: absolute;
            border-style: solid;
            border-width: 23px 11px 0;
            border-color: #FFFFFF transparent;
            display: block;
            width: 0;
            bottom: -23px; /* 부모 말풍선 바로 아래 */
            left: 80%; /* 부모 요소의 50%에서 시작 */
            transform: translateX(-50%); /* 정확히 중앙 정렬 */
        }

        .balloon:before {
            content: '';
            position: absolute;
            border-style: solid;
            border-width: 24px 12px 0;
            border-color: #000000 transparent;
            display: block;
            width: 0;
            bottom: -26px;
            left: 80%; /* 부모 요소의 50% */
            transform: translateX(-50%); /* 정확히 중앙 정렬 */
        }

        @media (max-width: 992px) {
            .main {
                margin: 0;
            }

            .carousel-container {
                max-height: unset;
            }

            .blank-container {
                display: none;
            }

            .balloon-container {
                padding: 0%;
            }
        }

}

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


</head>

<body style="background-color: #DCD0B2;">

                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                                data-bs-slide="prev">

                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Blank div -->
            <div class="blank-container col-2"></div>

            <!-- carousel explain with calc img -->
            <div class="col-lg-4 col-5 d-flex flex-column justify-content-end align-items-end">
                <!-- 동기화된 div -->
                <div class="balloon-container">
                    <div class="balloon">
                        <div id="syncDiv"></div>
                    </div>
                </div>


                <!-- img container -->
                <div class="img-container">
                    <img src="/static/images/calc.png" alt="calc" class="img-fluid w-100 w-lg-50" style="max-width: 50vh;">
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const carouselElement = document.getElementById('carouselExampleCaptions');
        const syncDiv = document.getElementById('syncDiv');

        // 초기 활성 슬라이드 설명 설정
        const activeItem = carouselElement.querySelector('.carousel-item.active');
        if (activeItem) {
            const initialDescription = activeItem.getAttribute('data-description');
            syncDiv.textContent = initialDescription;
        }

        // 캐러셀의 'slid' 이벤트 리스너 추가
        carouselElement.addEventListener('slid.bs.carousel', function (e) {
            const activeItem = e.relatedTarget;
            const description = activeItem.getAttribute('data-description');

            // 애니메이션 효과를 위해 CSS 클래스를 토글
            syncDiv.classList.add('fade-out');
            setTimeout(() => {
                syncDiv.textContent = description;
                syncDiv.classList.remove('fade-out');
                syncDiv.classList.add('fade-in');
                setTimeout(() => {
                    syncDiv.classList.remove('fade-in');
                }, 50); // 애니메이션 지속 시간
            }, 50); // 애니메이션 지속 시간
        });
    });
</script>
<script>
    // JavaScript: 스크롤 방향에 따라 navbar 숨김/표시
    let lastScrollY = window.scrollY; // 마지막 스크롤 위치 저장

    window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        const currentScrollY = window.scrollY;

        if (currentScrollY > lastScrollY) {
            // 아래로 스크롤 중
            navbar.classList.add('navbar-hidden');
        } else {
            // 위로 스크롤 중
            navbar.classList.remove('navbar-hidden');
        }

        // 현재 스크롤 위치를 업데이트
        lastScrollY = currentScrollY;
    });
</script>

</body>
